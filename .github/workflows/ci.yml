name: Build

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Same install Cloudflare runs, so a lockfile drift fails here first.
      - run: npm ci

      - run: npm run build

      - name: Check every referenced asset exists
        run: node scripts/check-assets.mjs
